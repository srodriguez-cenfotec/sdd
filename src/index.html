<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fc">
    <title>Curso-PSWE-07</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <h1>Curso-PSWE-07</h1>
        <button id="add-task-button" class="button button-primary" type="button">
          Add task
        </button>
      </header>

      <main>
        <p id="app-error" class="app-error" role="alert" hidden></p>

        <section id="list-view" aria-label="To-Do List">
          <div class="filter-group" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-button" data-filter="all" aria-pressed="true">
              All
            </button>
            <button type="button" class="filter-button" data-filter="pending" aria-pressed="false">
              Pending
            </button>
            <button type="button" class="filter-button" data-filter="done" aria-pressed="false">
              Done
            </button>
          </div>

          <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
          <p id="empty-state" class="empty-state" hidden></p>
        </section>

        <section id="detail-view" class="detail-view" aria-label="To-Do Detail" hidden>
          <button id="back-button" class="button button-secondary" type="button">
            Back to list
          </button>
          <article class="detail-card">
            <h2 id="detail-title" class="detail-title"></h2>
            <p id="detail-description" class="detail-description"></p>
            <p class="status-line">
              Status: <span id="detail-status" class="status-label"></span>
            </p>
            <div class="detail-actions">
              <button id="edit-task-button" class="button button-secondary" type="button">
                Edit
              </button>
              <button id="toggle-status-button" class="button button-primary" type="button"></button>
              <button id="delete-task-button" class="button button-danger" type="button">
                Delete
              </button>
            </div>
          </article>
        </section>
      </main>
    </div>

    <dialog id="task-form-dialog" aria-labelledby="task-form-heading">
      <form id="task-form" novalidate>
        <div class="dialog-heading">
          <h2 id="task-form-heading">Add task</h2>
          <button
            id="close-form-button"
            class="icon-button"
            type="button"
            aria-label="Close form"
          >
            ×
          </button>
        </div>
        <div class="form-field">
          <label for="task-title">Title</label>
          <input
            id="task-title"
            name="title"
            type="text"
            autocomplete="off"
            aria-required="true"
            aria-describedby="title-error"
          >
          <p id="title-error" class="field-error" role="alert" hidden></p>
        </div>
        <div class="form-field">
          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" rows="4"></textarea>
        </div>
        <p id="form-error" class="app-error" role="alert" hidden></p>
        <div class="form-actions">
          <button id="cancel-form-button" class="button button-secondary" type="button">
            Cancel
          </button>
          <button id="save-task-button" class="button button-primary" type="submit">
            Create task
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
